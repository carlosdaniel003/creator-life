name: Build Creator Life

on:
  push:
    branches:
      - feat/isometric-3d-room
  pull_request:
    branches:
      - main
      - ci/build-check

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
