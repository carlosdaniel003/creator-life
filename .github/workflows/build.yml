name: Build Creator Life

on:
  push:
    branches:
      - feat/isometric-3d-room
  pull_request:
    branches:
      - main
      - ci/build-check

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install dependencies
        run: npm install
      - name: Build
        id: project-build
        continue-on-error: true
        shell: bash
        run: npm run build > build.log 2>&1
      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-life-build-report
          path: build.log
          retention-days: 1
      - name: Confirm build result
        if: steps.project-build.outcome == 'failure'
        run: exit 1
