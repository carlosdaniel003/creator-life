name: Build Creator Life

on:
  push:
    branches:
      - feat/isometric-3d-room
  pull_request:
    branches:
      - main
      - ci/build-check

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install

      - name: Capture build
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          echo $? > build.status
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pause-editor-build-log
          path: build.log

      - name: Check build result
        shell: bash
        run: exit $(cat build.status)
